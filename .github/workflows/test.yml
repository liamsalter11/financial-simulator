name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Recompiles every .jsx and asserts the committed .js sibling matches, so a forgotten
      # `npm run build` is caught here rather than shipping a stale file to the browser.
      - name: Unit tests (includes the .jsx/.js sync guard)
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
